services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    # Keeps downloaded files out of the image / off the container layer.
    volumes:
      - ./downloads:/app/downloads
      # Mounts cookies.txt (if present) so the bot can download from YouTube on
      # a server, which YouTube blocks as a "bot" without logged-in cookies.
      # Export cookies.txt from a logged-in browser and place it next to this
      # file. Harmless if the file is absent (the bot ignores it).
      - ./cookies.txt:/app/cookies.txt:ro

  # Optional local Bot API server to send files up to 2 GB (instead of 50 MB).
  # Enable it with:  docker compose --profile bigfiles up -d --build
  # Requires TELEGRAM_API_ID / TELEGRAM_API_HASH in .env (from my.telegram.org)
  # and BOT_API_BASE=http://telegram-bot-api:8081 + a higher MAX_FILESIZE_MB.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    profiles: ["bigfiles"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telegram-bot-api-data:
